<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taiman AI PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
margin:0;
background:#000;
color:#0ff;
font-family:Arial;
text-align:center;
}

#container{
position:relative;
width:100%;
max-width:700px;
margin:auto;
border:2px solid cyan;
border-radius:10px;
box-shadow:0 0 20px cyan;
}

video{
width:100%;
background:#000;
}

canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

#info{
font-size:20px;
margin-top:10px;
color:#0f0;
}

button{
margin-top:10px;
padding:10px 20px;
font-size:16px;
background:cyan;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<h2>🤖 Taiman AI PRO MAX</h2>

<div id="container">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div id="info">Boshlash tugmasini bosing</div>

<button onclick="startApp()">▶️ Boshlash</button>
<button onclick="switchCamera()">🔄 Kamera almashtirish</button>
<button onclick="takePhoto()">📸 Screenshot</button>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let model;
let stream;
let camera="environment";
let started=false;

let voices=[];
let voiceReady=false;
let lastSpoken="";
let lastSpeakTime=0;

// Uzbek tarjima
const uz = {
"person":"Inson",
"bottle":"Shisha",
"cell phone":"Telefon",
"chair":"Stul",
"cup":"Chashka",
"laptop":"Noutbuk",
"tv":"Televizor",
"potted plant":"O‘simlik",
"book":"Kitob",
"dog":"It",
"cat":"Mushuk"
};

// VOICE LOAD FIX
function loadVoices(){
voices = speechSynthesis.getVoices();
if(voices.length > 0){
voiceReady = true;
}
}

// ba'zi telefonlarda bu kerak
speechSynthesis.onvoiceschanged = loadVoices;

// Speak
function speak(text){
if(!voiceReady) return;
if(!text || text === lastSpoken) return;

let now = Date.now();
if(now - lastSpeakTime < 4000) return;

lastSpeakTime = now;
lastSpoken = text;

speechSynthesis.cancel();

const msg = new SpeechSynthesisUtterance(text);

// Uzbek -> Rus -> English fallback
let voice = voices.find(v=>v.lang.includes("uz")) 
          || voices.find(v=>v.lang.includes("ru")) 
          || voices.find(v=>v.lang.includes("en"));

if(voice) msg.voice = voice;

msg.rate = 1;
msg.pitch = 1;

speechSynthesis.speak(msg);
}

// USER CLICK orqali unlock
function unlockVoice(){
const msg = new SpeechSynthesisUtterance("Start");
speechSynthesis.speak(msg);
speechSynthesis.cancel();
}

// START
async function startApp(){
unlockVoice();
loadVoices();

if(started) return;
started=true;

document.getElementById("info").innerText="Kamera yuklanmoqda...";

try{
await startCamera();
await loadAI();
}catch(e){
alert("Xatolik: "+e.message);
}
}

// CAMERA
async function startCamera(){
if(stream) stream.getTracks().forEach(t=>t.stop());

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:camera, width:{ideal:1280}, height:{ideal:720}}
});

video.srcObject = stream;
await video.play();
}

// SWITCH CAMERA
function switchCamera(){
camera = camera==="environment" ? "user" : "environment";
if(started) startCamera();
}

// AI LOAD
async function loadAI(){
document.getElementById("info").innerText="AI yuklanmoqda...";
model = await cocoSsd.load();
document.getElementById("info").innerText="AI tayyor!";
detect();
}

// DETECT LOOP (FAST)
async function detect(){
if(!video.videoWidth){
requestAnimationFrame(detect);
return;
}

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

const predictions = await model.detect(video);
const filtered = predictions.filter(p=>p.score>0.4);

ctx.clearRect(0,0,canvas.width,canvas.height);

// night vision effect
ctx.fillStyle = "rgba(0,255,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

let counts = {};

filtered.forEach(p=>{
if(!counts[p.class]) counts[p.class]=0;
counts[p.class]++;

const [x,y,w,h] = p.bbox;

const colors = ["red","lime","cyan","yellow","magenta","orange"];
const color = colors[p.class.length % colors.length];

ctx.strokeStyle = color;
ctx.lineWidth = 3;
ctx.shadowColor = color;
ctx.shadowBlur = 15;
ctx.strokeRect(x,y,w,h);

const name = uz[p.class] || p.class;
const percent = Math.round(p.score * 100) + "%";

ctx.fillStyle = color;
ctx.font = "18px Arial";
ctx.fillText(name + " " + percent, x, y>10?y-5:10);
});

// TEXT + VOICE
let text="", voiceText="";
for(let item in counts){
let name = uz[item] || item;
let count = counts[item];
text += name + " : " + count + "<br>";
voiceText += count + " ta " + name + ", ";
}

document.getElementById("info").innerHTML = text || "Hech narsa topilmadi";

if(voiceText) speak(voiceText);

requestAnimationFrame(detect);
}

// SCREENSHOT
function takePhoto(){
let link = document.createElement('a');
link.download = "taiman-ai.png";
link.href = canvas.toDataURL();
link.click();
}

</script>

</body>
</html>
